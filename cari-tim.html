<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cari Tim - Skill Link</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .search-filter-bar {
            display: flex; gap: 12px; margin-bottom: 18px; flex-wrap: wrap;
        }
        .search-input-box { flex: 1; min-width: 240px; position: relative; }
        .search-input-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #64748b; font-size: 13px; }
        .search-input-box input {
            width: 100%; padding: 11px 16px 11px 40px; border-radius: 12px;
            border: 1px solid #38bdf8; background: white; font-size: 13px; outline: none;
        }
        .cat-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
        .cat-pill {
            padding: 7px 18px; border-radius: 18px; border: none; background: white;
            color: #475569; font-size: 12px; font-weight: 700; cursor: pointer;
        }
        .cat-pill.active { background: #0b7fd0; color: white; }

        .teams-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px;
        }
        .team-discover-card {
            background: white; border-radius: 14px; padding: 20px 22px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .td-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; }
        .td-identity { display: flex; align-items: center; gap: 12px; }
        .td-avatar {
            width: 44px; height: 44px; border-radius: 12px; color: white; font-weight: 700;
            display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0;
        }
        .td-identity h3 { font-size: 16px; margin-bottom: 2px; }
        .td-identity span { font-size: 12px; color: #0b7fd0; font-weight: 600; }
        .slot-badge { padding: 4px 12px; border-radius: 14px; background: #dcfce7; color: #15803d; font-size: 11px; font-weight: 700; }
        .td-desc { font-size: 13px; color: #475569; line-height: 1.5; margin-bottom: 14px; }
        .td-roles { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; }
        .role-tag { padding: 4px 12px; border-radius: 14px; background: #f1f5f9; color: #334155; font-size: 11px; font-weight: 600; }
        .td-footer {
            display: flex; justify-content: space-between; align-items: center;
            padding-top: 12px; border-top: 1px solid #f1f5f9; font-size: 12px; color: #64748b;
        }
        .btn-applied {
            padding: 8px 18px; border-radius: 8px; border: 1px solid #86efac;
            background: #dcfce7; color: #15803d; font-size: 12px; font-weight: 700; cursor: default;
        }
        @media (max-width: 820px) { .teams-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div id="appShell"></div>

    <main class="main-container">
        <div class="page-header-row">
            <div>
                <h1 class="page-title">Cari Tim Lomba</h1>
                <p class="page-subtitle">Temukan tim kompetisi yang sedang membuka rekrutmen sesuai minat dan keahlianmu.</p>
            </div>
            <button type="button" class="btn-outline" onclick="location.href='filter-rekrutmen.html'">
                <i class="fa-solid fa-sliders"></i> Filter Lanjutan
            </button>
        </div>

        <div class="search-filter-bar">
            <div class="search-input-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="teamSearchInput" placeholder="Cari nama tim, lomba, atau posisi yang dibutuhkan...">
            </div>
        </div>

        <div class="cat-pills">
            <button type="button" class="cat-pill active" data-cat="Semua">Semua Kategori</button>
            <button type="button" class="cat-pill" data-cat="Hackathon">Hackathon</button>
            <button type="button" class="cat-pill" data-cat="UI/UX Design">UI/UX Design</button>
            <button type="button" class="cat-pill" data-cat="Data Science">Data Science</button>
            <button type="button" class="cat-pill" data-cat="IoT">IoT</button>
        </div>

        <div class="teams-grid" id="teamsGrid"></div>
    </main>

    <!-- Modal Ajukan Gabung -->
    <div id="joinModal" class="modal-overlay">
        <div class="modal-box" style="max-width:440px;">
            <h2 style="font-size:18px; margin-bottom:4px;" id="joinModalTitle">Ajukan Bergabung</h2>
            <p style="font-size:12px; color:#64748b; margin-bottom:16px;" id="joinModalSub">Pilih posisi yang ingin Anda lamar.</p>

            <div style="margin-bottom:14px;">
                <label style="display:block; font-size:12px; font-weight:700; margin-bottom:6px;">Posisi yang Dilamar</label>
                <select id="joinRoleSelect" style="width:100%; padding:10px; border-radius:8px; border:1px solid #cbd5e1; font-size:13px;"></select>
            </div>

            <div style="margin-bottom:18px;">
                <label style="display:block; font-size:12px; font-weight:700; margin-bottom:6px;">Pesan Singkat untuk Ketua Tim</label>
                <textarea id="joinNoteInput" rows="3" style="width:100%; padding:10px; border-radius:8px; border:1px solid #cbd5e1; font-size:13px;" placeholder="Perkenalkan keahlian dan pengalamanmu..."></textarea>
            </div>

            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button type="button" class="btn-outline" id="closeJoinModal">Batal</button>
                <button type="button" class="btn-primary" id="submitJoinBtn">Kirim Permintaan</button>
            </div>
        </div>
    </div>

    <script src="app-core.js"></script>
    <script>
        const REQUESTS_KEY = "skillLinkRequests";
        const openTeams = [
            {
                id: 1, name: "Byte Builders", competition: "Gemastik 2026 · Hackathon", category: "Hackathon",
                leader: "Rezka", slotsLeft: 2, color: "#ea580c",
                desc: "Membangun aplikasi mobile & AI untuk efisiensi layanan kesehatan kampus.",
                roles: ["UI/UX Designer", "Data Engineer"]
            },
            {
                id: 2, name: "Pixel Crafters", competition: "Kompetisi UI/UX Nasional", category: "UI/UX Design",
                leader: "Nadia Kusuma", slotsLeft: 1, color: "#0b7fd0",
                desc: "Fokus pada riset pengalaman pengguna dan prototipe interaktif aplikasi inklusif.",
                roles: ["UX Researcher"]
            },
            {
                id: 3, name: "Data Mavericks", competition: "Data Science Challenge", category: "Data Science",
                leader: "Gilang Ramadhan", slotsLeft: 3, color: "#0d9488",
                desc: "Analisis prediktif pertanian cerdas berbasis machine learning dan citra satelit.",
                roles: ["Data Scientist", "Backend Developer"]
            },
            {
                id: 4, name: "AgroTech Lampung", competition: "Innovation Challenge IoT", category: "IoT",
                leader: "Rafi Akbar", slotsLeft: 2, color: "#6366f1",
                desc: "Sistem monitoring kelembapan tanah otomatis berbasis mikrokontroler dan dashboard web.",
                roles: ["Frontend Developer", "IoT Engineer"]
            }
        ];

        let joinedIds = JSON.parse(localStorage.getItem(REQUESTS_KEY) || "[]");
        let activeCat = "Semua";
        let targetTeam = null;

        function renderTeams() {
            const q = (document.getElementById("teamSearchInput").value || "").toLowerCase().trim();
            const filtered = openTeams.filter(t => {
                const matchCat = activeCat === "Semua" || t.category === activeCat;
                const matchQ = !q || t.name.toLowerCase().includes(q) || t.competition.toLowerCase().includes(q) || t.roles.join(" ").toLowerCase().includes(q);
                return matchCat && matchQ;
            });

            document.getElementById("teamsGrid").innerHTML = filtered.map(t => {
                const isApplied = joinedIds.includes(t.id);
                return `
                    <article class="team-discover-card">
                        <div>
                            <div class="td-top">
                                <div class="td-identity">
                                    <div class="td-avatar" style="background:${t.color};">${t.name.substring(0,2).toUpperCase()}</div>
                                    <div>
                                        <h3>${t.name}</h3>
                                        <span>${t.competition}</span>
                                    </div>
                                </div>
                                <span class="slot-badge">Sisa ${t.slotsLeft} slot</span>
                            </div>
                            <p class="td-desc">${t.desc}</p>
                            <div class="td-roles">
                                ${t.roles.map(r => `<span class="role-tag">${r}</span>`).join("")}
                            </div>
                        </div>
                        <div class="td-footer">
                            <span>Ketua: <b>${t.leader}</b></span>
                            ${isApplied
                                ? `<button type="button" class="btn-applied">✓ Permintaan Terkirim</button>`
                                : `<button type="button" class="btn-primary" style="padding:8px 18px; font-size:12px;" onclick="openJoinModal(${t.id})">Ajukan Gabung</button>`
                            }
                        </div>
                    </article>
                `;
            }).join("");
        }

        window.openJoinModal = function (id) {
            targetTeam = openTeams.find(t => t.id === id);
            if (!targetTeam) return;
            document.getElementById("joinModalTitle").textContent = `Gabung ke ${targetTeam.name}`;
            document.getElementById("joinModalSub").textContent = targetTeam.competition;
            document.getElementById("joinRoleSelect").innerHTML = targetTeam.roles.map(r => `<option value="${r}">${r}</option>`).join("");
            document.getElementById("joinNoteInput").value = "";
            document.getElementById("joinModal").style.display = "flex";
        };

        document.getElementById("closeJoinModal").addEventListener("click", () => {
            document.getElementById("joinModal").style.display = "none";
        });

        document.getElementById("submitJoinBtn").addEventListener("click", () => {
            if (!targetTeam) return;
            if (!joinedIds.includes(targetTeam.id)) {
                joinedIds.push(targetTeam.id);
                localStorage.setItem(REQUESTS_KEY, JSON.stringify(joinedIds));
            }
            document.getElementById("joinModal").style.display = "none";
            renderTeams();
            window.showToast(`Permintaan bergabung ke ${targetTeam.name} berhasil dikirim!`);
        });

        document.querySelectorAll(".cat-pill").forEach(btn => {
            btn.addEventListener("click", () => {
                document.querySelectorAll(".cat-pill").forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                activeCat = btn.dataset.cat;
                renderTeams();
            });
        });

        document.getElementById("teamSearchInput").addEventListener("input", renderTeams);

        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            if (params.get("q")) {
                document.getElementById("teamSearchInput").value = params.get("q");
            }
            renderTeams();
        });
    </script>
</body>
</html>
